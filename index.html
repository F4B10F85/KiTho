<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KiTHO PET</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background-color: #00645a;
    }

    /* TOP BAR */
    .topbar {
      display: flex;
      align-items: center;
      background: rgba(255,255,255,0.8);
      padding: 10px;
      color: white;
    }

    .menu-btn {
      font-size: 24px;
      background: none;
      border: none;
      color: white;
      margin-right: 10px;
      cursor: pointer;
    }

    /* MENU */
    .menu {
      display: none;
      flex-direction: column;
      background: rgba(255,255,255,0.8);
      position: absolute;
      top: 50px;
      left: 0;
      width: 250px;
    }

    .menu button {
      padding: 15px;
      border: none;
      background: none;
      color: white;
      text-align: left;
      cursor: pointer;
      width: 100%;
    }

    .menu button:hover {
      background: rgba(255,255,255,0.2);
    }

    .submenu {
      display: none;
      background: rgba(255,255,255,0.1);
    }

    .submenu button {
      padding-left: 30px;
      font-size: 14px;
    }

    /* PAGINE */
    .pagina {
      display: none;
      padding: 20px;
      min-height: 100vh;
      background-color: #009688;
      color: black;
    }

    .attiva {
      display: block;
    }

    /* HOME con immagine */
    .home-bg {
      background-image: url('https://i.ibb.co/7JTMF0rb/DSC1225.jpg'); /* METTI IL TUO LINK GIUSTO */
      background-size: cover;
      background-position: center;
      color: white;
    }
  </style>
</head>

<body>

  <!-- TOP BAR -->
  <div class="topbar">
    <button class="menu-btn" onclick="toggleMenu()">☰</button>
    <h2>KiTHO PET</h2>
  </div>

  <!-- MENU -->
  <div id="menu" class="menu">

    <button onclick="mostra('home')">Home</button>
    <button onclick="mostra('chiSiamo')">Chi siamo</button>

    <button onclick="toggleSubmenu()">Prodotti ▼</button>
    <div id="submenuProdotti" class="submenu">
      <button onclick="mostra('collari')">Collari</button>
      <button onclick="mostra('guinzagli')">Guinzagli</button>
      <button onclick="mostra('pettorine')">Pettorine</button>
      <button onclick="mostra('giochi')">Giochi</button>
      <button onclick="mostra('poopbag')">Poop Bag</button>
      <button onclick="mostra('capezze')">Cappezze</button>
      <button onclick="mostra('cinture')">Cinture</button>
    </div>

    <button onclick="mostra('personalizzazione')">Personalizzazione</button>
    <button onclick="mostra('contatti')">Contatti</button>
    <button onclick="mostra('carrello')">Carrello</button>

  </div>

  <!-- HOME -->
  <div id="home" class="pagina attiva home-bg">
    <h1>KiTHO PET</h1>
    <p>Scrivi qui il tuo testo iniziale</p>
  </div>

  <!-- ALTRE PAGINE -->
  <div id="chiSiamo" class="pagina">
    <h1>Chi siamo</h1>
  </div>

  <div id="collari" class="pagina">
    <h1>Collari</h1>
  </div>

  <div id="guinzagli" class="pagina">
    <h1>Guinzagli</h1>
  </div>

  <div id="pettorine" class="pagina">
    <h1>Pettorine</h1>
  </div>

  <div id="giochi" class="pagina">
    <h1>Giochi</h1>
  </div>

  <div id="poopbag" class="pagina">
    <h1>Poop Bag</h1>
  </div>

  <div id="capezze" class="pagina">
    <h1>Cappezze</h1>
  </div>

  <div id="cinture" class="pagina">
    <h1>Cinture</h1>
  </div>

  <div id="personalizzazione" class="pagina">
    <h1>Personalizzazione</h1>
  </div>

  <div id="contatti" class="pagina">
    <h1>Contatti</h1>
  </div>

  <div id="carrello" class="pagina">
    <h1>Carrello</h1>
  </div>

  <!-- SCRIPT -->
  <script>
    function toggleMenu() {
      const menu = document.getElementById("menu");
      menu.style.display = menu.style.display === "flex" ? "none" : "flex";
    }

    function toggleSubmenu() {
      const submenu = document.getElementById("submenuProdotti");
      submenu.style.display = submenu.style.display === "block" ? "none" : "block";
    }

    function mostra(pagina) {
      const pagine = document.querySelectorAll(".pagina");
      pagine.forEach(p => p.classList.remove("attiva"));

      document.getElementById(pagina).classList.add("attiva");

      document.getElementById("menu").style.display = "none";
    }
  </script>

</body>
</html>
